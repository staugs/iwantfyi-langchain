[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iwantfyi-langchain"
version = "0.1.0"
description = "LangChain tools for iwant.fyi -- reference implementation of the iwant.fyi demand-side protocol v1.0. Lets any LangChain agent express structured purchase intent and receive matched supply."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "iwant.fyi", email = "hi@iwant.fyi" },
]
keywords = [
    "demand-protocol",
    "langchain",
    "mcp",
    "ai-agent",
    "commerce",
    "iwant.fyi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "langchain-core>=0.1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://iwant.fyi/protocol/v1"
Repository = "https://github.com/staugs/iwant.fyi"
Spec = "https://iwant.fyi/protocol/v1"
"Bug Tracker" = "https://github.com/staugs/iwant.fyi/issues"

[tool.hatch.build.targets.wheel]
packages = ["iwantfyi_langchain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
